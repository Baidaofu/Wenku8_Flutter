name: Build trial (APK arm64 + unsigned IPA)

on:
  push:
    branches: ['master', 'trial', 'online']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Build failures must be readable without admin rights on the repo, so the
      # full output is echoed into the step log and also uploaded as an artifact.
      - name: Build arm64-v8a release APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 \
            > build.log 2>&1 || true
          echo '========== build output =========='
          cat build.log
          echo '========== errors only =========='
          grep -nE 'Error:|error:|FAILURE|What went wrong|Unresolved|not found|No file or variants' build.log || echo '(no error lines matched)'
          echo '=================================='
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-apk-build-log
          path: build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: trial-apk-arm64
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign > build.log 2>&1 || true
          echo '========== build output =========='
          cat build.log
          echo '========== errors only =========='
          grep -nE 'Error:|error:|FAILURE|What went wrong|not found|No such file' build.log || echo '(no error lines matched)'
          echo '=================================='
          test -d build/ios/iphoneos/Runner.app
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Wenku8-unsigned.ipa Payload
          ls -lh Wenku8-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-ipa-build-log
          path: build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: trial-ipa-unsigned
          path: Wenku8-unsigned.ipa
          if-no-files-found: error
