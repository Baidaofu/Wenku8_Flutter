name: Build trial (APK arm64 + unsigned IPA)

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build arm64-v8a release APK
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: trial-apk-arm64
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Wenku8-unsigned.ipa Payload
          ls -lh Wenku8-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: trial-ipa-unsigned
          path: Wenku8-unsigned.ipa
          if-no-files-found: error
